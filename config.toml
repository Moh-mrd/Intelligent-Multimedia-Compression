[server]
maxUploadSize = 50            # MB. The app reads this value, so change it only here.
headless = true
enableCORS = false            # needed when the app is shown inside the Hugging Face iframe
enableXsrfProtection = false  # otherwise file uploads fail with 403 inside that iframe

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0A1424"
secondaryBackgroundColor = "#12233D"
textColor = "#E7EEF8"
